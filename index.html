<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>重灌必裝清單</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 24px;
    }
    h1 { margin-bottom: 8px; }
    #search { 
      width: 100%; 
      padding: 8px; 
      border-radius: 8px; 
      border: none; 
      margin-bottom: 16px; 
      font-size: 16px;
    }
    h2 {
      margin-top: 32px;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
      cursor: pointer;
      user-select: none;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .card {
      background: #020617;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      text-decoration: none;
      color: #e5e7eb;
      transition: transform 0.15s ease;
    }
    .card:hover { transform: translateY(-4px); }
    .card img { width: 48px; height: 48px; margin-bottom: 8px; }
    .card span { display: block; font-size: 14px; }
    .collapsed + .grid { display: none; }
  </style>
</head>
<body>

<h1>🧰 電腦重灌工具箱</h1>
<input type="text" id="search" placeholder="搜尋軟體...">
<div id="app"></div>

<script>
const app = document.getElementById('app');
const searchInput = document.getElementById('search');

let allData = {};

fetch('apps.json')
  .then(res => res.json())
  .then(data => {
    allData = data;
    renderApps(data);
  })
  .catch(err => {
    console.error('❌ 載入 apps.json 失敗:', err);
    app.textContent = 'apps.json 載入失敗，請看 Console';
  });

function renderApps(data) {
  app.innerHTML = '';
  for (const category in data) {
    const h2 = document.createElement('h2');
    h2.textContent = category;
    h2.classList.add('category-title');
    h2.addEventListener('click', () => h2.classList.toggle('collapsed'));
    app.appendChild(h2);

    const grid = document.createElement('div');
    grid.className = 'grid';
    
    data[category].forEach(item => {
      const a = document.createElement('a');
      a.className = 'card';
      a.href = item.url;
      a.target = '_blank';
      a.innerHTML = `<img src="icons/${item.icon}"><span>${item.name}</span>`;
      grid.appendChild(a);
    });

    app.appendChild(grid);
  }
}

// 搜尋功能
searchInput.addEventListener('input', () => {
  const keyword = searchInput.value.toLowerCase();
  const filtered = {};

  for (const cat in allData) {
    filtered[cat] = allData[cat].filter(item => item.name.toLowerCase().includes(keyword));
  }

  renderApps(filtered);
});
</script>

</body>
</html>
