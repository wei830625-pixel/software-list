<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>重灌必裝清單</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 24px;
    }
    h1 {
      margin-bottom: 16px;
    }
    h2 {
      margin-top: 24px;
      margin-bottom: 8px;
      border-bottom: 1px solid #334155;
      padding-bottom: 4px;
    }
    ul {
      list-style: none;
      padding-left: 0;
    }
    li {
      margin-bottom: 6px;
      display: flex;
      align-items: center;
    }
    li img {
      width: 20px;
      height: 20px;
      margin-right: 8px;
    }
    li a {
      color: #e5e7eb;
      text-decoration: none;
    }
    li a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

<h1>🧰 電腦重灌工具箱</h1>
<p>簡單列表視圖</p>

<div id="app"></div>

<script>
fetch('apps.json')
  .then(res => res.json())
  .then(data => {
    const app = document.getElementById('app');

    for (const category in data) {
      // 分類標題
      const h2 = document.createElement('h2');
      h2.textContent = category;
      app.appendChild(h2);

      // 建立列表
      const ul = document.createElement('ul');

      data[category].forEach(item => {
        const li = document.createElement('li');
        const a = document.createElement('a');
        a.href = item.url;
        a.target = '_blank';

        a.innerHTML = `<img src="icons/${item.icon}" alt=""> ${item.name}`;
        li.appendChild(a);
        ul.appendChild(li);
      });

      app.appendChild(ul);
    }
  })
  .catch(err => {
    console.error('載入 apps.json 失敗:', err);
  });
</script>

</body>
</html>
