<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>重灌必裝清單</title>

  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5efe6; /* 淺奶茶 */
      color: #4b3f35;      /* 深奶茶文字 */
      margin: 0;
      padding: 28px;
    }

    h1 {
      margin-bottom: 8px;
    }

    p {
      margin-top: 0;
      margin-bottom: 24px;
      color: #6b5c50;
    }

    h2 {
      margin-top: 32px;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid #e0d6c8;
      color: #3f342c;
    }

    /* 重點：橫向優先 + 自動換行 */
    ul {
      list-style: none;
      padding-left: 0;
      display: flex;
      flex-wrap: wrap;        /* 關鍵 */
      gap: 10px 18px;         /* 行距 / 列距 */
    }

    li {
      background: #fffaf3;
      border-radius: 10px;
      padding: 6px 12px;
      display: flex;
      align-items: center;
      transition: background 0.15s ease, transform 0.15s ease;
    }

    li:hover {
      background: #f1e7d8;
      transform: translateY(-1px);
    }

    li img {
      width: 18px;
      height: 18px;
      margin-right: 8px;
      flex-shrink: 0;
    }

    li a {
      color: #4b3f35;
      text-decoration: none;
      font-size: 14px;
      white-space: nowrap; /* 避免名稱被拆行 */
    }
  </style>
</head>
<body>

<h1>🧰 電腦重灌工具箱</h1>
<p>又偉世界大帥哥 ☕</p>

<div id="app"></div>

<script>
fetch('apps.json')
  .then(res => res.json())
  .then(data => {
    const app = document.getElementById('app');

    for (const category in data) {
      const h2 = document.createElement('h2');
      h2.textContent = category;
      app.appendChild(h2);

      const ul = document.createElement('ul');

      data[category].forEach(item => {
        const li = document.createElement('li');
        li.innerHTML = `
          <a href="${item.url}" target="_blank">
            <img src="icons/${item.icon}" alt="">
            ${item.name}
          </a>
        `;
        ul.appendChild(li);
      });

      app.appendChild(ul);
    }
  })
  .catch(err => console.error(err));
</script>

</body>
</html>
