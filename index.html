<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <title>重灌必裝清單</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #e5e7eb;
      margin: 0;
      padding: 24px;
    }

    h1 {
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 32px;
      border-bottom: 1px solid #334155;
      padding-bottom: 6px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .card {
      background: #020617;
      border-radius: 12px;
      padding: 14px 10px;
      text-align: center;
      text-decoration: none;
      color: #e5e7eb;
      transition: transform 0.15s ease;
    }

    .card:hover {
      transform: translateY(-4px);
    }

    .card img {
      width: 48px;
      height: 48px;
      margin-bottom: 8px;
    }

    .card span {
      display: block;
      font-size: 14px;
    }
  </style>
</head>
<body>

<h1>🧰 電腦重灌工具箱</h1>
<p>又偉大帥哥</p>

<div id="app"></div>

<script>
fetch('apps.json')
  .then(res => res.json())
  .then(data => {
    const app = document.getElementById('app');

    for (const category in data) {
      const h2 = document.createElement('h2');
      h2.textContent = category;
      app.appendChild(h2);

      const grid = document.createElement('div');
      grid.className = 'grid';

      data[category].forEach(item => {
        const a = document.createElement('a');
        a.className = 'card';
        a.href = item.url;
        a.target = '_blank';

        a.innerHTML = `
          <img src="icons/${item.icon}">
          <span>${item.name}</span>
        `;

        grid.appendChild(a);
      });

      app.appendChild(grid);
    }
  });
</script>

</body>
</html>
